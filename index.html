<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Central de Emergências</title>
    </head>
    <body>
        <h1>Central de Emergências</h1>

        <p>
            Carregar CSV: <input type="file" id="arquivo" accept=".csv" autocomplete="off" />
            <span id="infoCarga"></span>
        </p>

        <p>
            <button type="button" id="nova">Nova ocorrência</button>
            <button type="button" id="salvarCsv">Salvar CSV</button>
        </p>

        <form id="consulta" autocomplete="off">
            <fieldset>
                <legend>Consultar por id</legend>
                Id: <input id="id" size="10" required />
                <button type="submit">Consultar</button>
            </fieldset>
        </form>

        <form id="busca" autocomplete="off">
            <fieldset>
                <legend>Filtros</legend>
                <p>
                    Endereço: <input id="endereco" list="sugestoes" size="30" />
                    <datalist id="sugestoes"></datalist>
                </p>
                <p>
                    Região:
                    <select id="regiao">
                        <option value="">todas</option>
                    </select>
                    Categoria:
                    <select id="categoria">
                        <option value="">todas</option>
                        <option>EMS</option>
                        <option>Fire</option>
                        <option>Traffic</option>
                    </select>
                    Tipo:
                    <select id="tipo">
                        <option value="">todos</option>
                    </select>
                </p>
                <p>
                    Período: de <input type="datetime-local" id="de" step="1" /> até
                    <input type="datetime-local" id="ate" step="1" />
                    <button type="button" data-minutos="30">30 min</button>
                    <button type="button" data-minutos="1440">24 h</button>
                    <button type="button" data-minutos="10080">7 dias</button>
                    <button type="button" id="qualquerPeriodo">qualquer período</button>
                </p>
                <p>
                    <label><input type="checkbox" id="soPendentes" checked /> só pendentes</label>
                </p>
            </fieldset>

            <fieldset>
                <legend>Ordem</legend>
                <label><input type="radio" name="ordem" value="recentes" /> recentes primeiro</label>
                <label><input type="radio" name="ordem" value="antigos" /> antigos primeiro</label>
                <label><input type="radio" name="ordem" value="prioridade" checked /> prioridade</label>
            </fieldset>

            <p>
                <button type="button" id="limpar">Limpar</button>
            </p>
        </form>

        <p id="contagem"></p>

        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Data/hora</th>
                    <th>Categoria</th>
                    <th>Tipo</th>
                    <th>Nível</th>
                    <th>Região</th>
                    <th>Endereço</th>
                    <th>Situação</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="linhas"></tbody>
        </table>

        <p><button id="anterior">Anterior</button> <span id="pagina"></span> <button id="proxima">Próxima</button></p>

        <dialog id="janela">
            <form method="dialog" id="editor" autocomplete="off">
                <p><strong id="tituloJanela"></strong></p>
                <p>
                    Categoria:
                    <select name="categoria">
                        <option>EMS</option>
                        <option>Fire</option>
                        <option>Traffic</option>
                    </select>
                    Tipo: <input name="tipo" list="tiposConhecidos" size="30" required />
                    <datalist id="tiposConhecidos"></datalist>
                </p>
                <p>
                    Região: <input name="regiao" list="regioesConhecidas" required />
                    <datalist id="regioesConhecidas"></datalist>
                    Zip: <input name="zip" size="6" required />
                </p>
                <p>Endereço: <input name="endereco" size="40" required /></p>
                <p>
                    <label><input type="checkbox" name="atendido" /> atendida</label>
                </p>
                <p>
                    <button value="salvar">Salvar</button>
                    <button value="remover" id="botaoRemover" formnovalidate>Remover</button>
                    <button value="cancelar" formnovalidate>Cancelar</button>
                </p>
            </form>
        </dialog>

        <dialog id="relatorio">
            <form method="dialog">
                <p><strong>Relatório da carga</strong></p>
                <pre id="textoRelatorio"></pre>
                <button>Fechar</button>
            </form>
        </dialog>

        <script src="tabelaHash.js"></script>
        <script src="tst.js"></script>
        <script src="arvoreBMais.js"></script>
        <script src="ocorrencia.js"></script>
        <script src="prioridades.js"></script>
        <script src="central.js"></script>
        <script src="pagina.js"></script>
    </body>
</html>
