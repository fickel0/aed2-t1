<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Central de Emergências</title>
    </head>
    <body>
        <h1>Central de Emergências</h1>

        <p>Carregar CSV: <input type="file" id="arquivo" accept=".csv" /> <span id="infoCarga"></span></p>

        <form id="busca">
            Período: de <input type="datetime-local" id="de" step="1" /> até
            <input type="datetime-local" id="ate" step="1" />
            <button type="button" data-minutos="30">30 min</button>
            <button type="button" data-minutos="1440">24 h</button>
            <button type="button" data-minutos="10080">7 dias</button>
            <button type="submit">Buscar</button>
        </form>

        <p id="contagem"></p>

        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Data/hora</th>
                    <th>Categoria</th>
                    <th>Tipo</th>
                    <th>Região</th>
                    <th>Endereço</th>
                    <th>Situação</th>
                </tr>
            </thead>
            <tbody id="linhas"></tbody>
        </table>

        <p><button id="anterior">Anterior</button> <span id="pagina"></span> <button id="proxima">Próxima</button></p>

        <script src="hash.js"></script>
        <script src="ocorrencia.js"></script>
        <script src="arvoreBMais.js"></script>
        <script src="pagina.js"></script>
    </body>
</html>
